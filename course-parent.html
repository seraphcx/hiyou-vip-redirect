*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:var(--ink);line-height:1.72;
  font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;
  background:
    radial-gradient(circle at 12% 4%, rgba(217,154,56,.18), transparent 26rem),
    radial-gradient(circle at 92% 12%, rgba(89,106,80,.18), transparent 30rem),
    linear-gradient(180deg,#fbf2df 0%, var(--paper) 58%, #f3e5ca 100%);
  background-attachment:fixed;display:grid;place-items:center;padding:28px}
.wrap{width:100%;max-width:520px}
.brand{display:flex;align-items:center;gap:10px;font-weight:950;color:var(--navy);
  font-size:15px;text-decoration:none;margin-bottom:22px;justify-content:center}
.brand i{width:27px;height:27px;border-radius:8px;background:var(--orange);
  position:relative;flex:0 0 auto;box-shadow:0 8px 18px rgba(233,90,42,.24)}
.brand i:before{content:"";position:absolute;width:12px;height:12px;left:5px;top:5px;
  border-radius:50%;background:var(--paper)}
.brand i:after{content:"";position:absolute;width:7px;height:7px;right:5px;bottom:5px;
  opacity:.72;border-radius:50%;background:var(--paper)}
.brand small{display:block;font-size:10px;color:var(--muted);font-weight:700;
  letter-spacing:.14em}
.card{background:rgba(255,255,255,.72);border:1px solid rgba(6,33,75,.13);
  border-radius:8px;box-shadow:0 18px 48px rgba(6,33,75,.11);padding:30px 28px}
.lockicon{width:46px;height:46px;border-radius:50%;background:var(--navy);
  display:grid;place-items:center;margin:0 auto 16px}
.lockicon svg{width:22px;height:22px}
.kicker{text-align:center;color:var(--orange);font-size:13px;font-weight:950;
  letter-spacing:.1em;margin:0 0 8px}
h1{margin:0 0 10px;text-align:center;color:var(--navy);font-size:23px;
  font-weight:950;line-height:1.35}
.sub{margin:0 0 22px;text-align:center;color:var(--muted);font-size:14.5px}
label{display:block;font-size:13px;font-weight:800;color:var(--navy);margin:0 0 6px}
input{width:100%;font:inherit;font-size:15px;padding:11px 13px;border-radius:8px;
  border:1px solid rgba(6,33,75,.16);background:rgba(255,255,255,.86);color:var(--ink)}
input:focus{outline:none;border-color:var(--orange);
  box-shadow:0 0 0 3px rgba(233,90,42,.12)}
.f{margin-bottom:14px}
button.go{width:100%;min-height:46px;font:inherit;font-size:15px;font-weight:950;
  color:#fffaf1;background:var(--orange);border:1px solid var(--orange);
  border-radius:8px;cursor:pointer;box-shadow:0 12px 24px rgba(233,90,42,.24);
  margin-top:4px;transition:filter .18s}
button.go:hover{filter:brightness(1.06)}
button.go:disabled{opacity:.6;cursor:default}
.row{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;
  color:var(--muted)}
.row input[type=checkbox]{width:auto}
.msg{margin-top:14px;font-size:13.5px;font-weight:800;text-align:center;min-height:20px}
.msg.err{color:#b3351b}
.msg.ok{color:var(--navy)}
.tip{margin-top:18px;padding-top:16px;border-top:1px solid rgba(6,33,75,.1);
  font-size:12.5px;color:var(--muted);text-align:center;line-height:1.7}
.tip a{color:var(--orange);font-weight:800}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,250,241,.4);
  border-top-color:#fffaf1;border-radius:50%;animation:sp .7s linear infinite;
  vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.logout{position:fixed;right:14px;top:14px;font-size:12px;color:var(--muted);
  background:rgba(255,255,255,.7);border:1px solid rgba(6,33,75,.14);
  border-radius:8px;padding:5px 10px;cursor:pointer;display:none;z-index:99}
.logout:hover{color:var(--navy)}

/* ── 报名 / 找回 弹层（收款码与价格属于公开信息，没登录也看得见） ── */
/* 2026-10-17 起：课程暂不对外，锁屏页改用下面这块「开放说明」，
   报名/找回两个弹层的样式与代码全部保留，只是不再挂按钮。 */
.open{margin-top:20px;padding:17px 18px 16px;border-radius:12px;text-align:center;
  background:rgba(233,90,42,.06);border:1px solid rgba(233,90,42,.17)}
.open .pline{margin:0 0 11px;font-size:13.5px;line-height:1.8}
.cta{display:inline-block;font-size:13.5px;font-weight:850;color:#fffaf1;
  background:var(--orange);text-decoration:none;padding:9px 22px;border-radius:9px;
  box-shadow:0 8px 20px rgba(233,90,42,.22);transition:transform .16s,box-shadow .16s}
.cta:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(233,90,42,.3)}
.links{display:flex;justify-content:center;gap:22px;margin-top:15px;font-size:13px}
.links button{appearance:none;background:none;border:none;font:inherit;font-weight:800;
  color:var(--orange);cursor:pointer;padding:2px 0;
  border-bottom:1px dashed rgba(233,90,42,.55)}
.links button:hover{color:var(--navy);border-bottom-color:var(--navy)}
.mask{position:fixed;inset:0;z-index:120;display:none;padding:24px 16px;overflow:auto;
  background:rgba(6,33,75,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.mask.on{display:block}
.modal{position:relative;width:100%;max-width:540px;margin:0 auto;
  background:#FDF7EA;border:1px solid rgba(6,33,75,.16);border-radius:10px;
  box-shadow:0 30px 70px rgba(6,33,75,.32);padding:28px 26px 24px}
.mx{position:absolute;right:9px;top:7px;appearance:none;background:none;border:none;
  font:inherit;font-size:25px;line-height:1;color:var(--muted);cursor:pointer;
  width:34px;height:34px;border-radius:8px}
.mx:hover{color:var(--navy);background:rgba(6,33,75,.07)}
.pk{color:var(--orange);font-size:12.5px;font-weight:950;letter-spacing:.1em;margin:0 0 6px}
.modal h2{margin:0 0 10px;color:var(--navy);font-size:20px;font-weight:950;line-height:1.35}
.pprice{display:flex;align-items:baseline;gap:10px;margin:0 0 14px;padding:12px 14px;

<script>
(function(){
"use strict";
var box=document.getElementById('lkData');
var F=document.getElementById('lk'), MSG=document.getElementById('lmsg'),
    GO=document.getElementById('lgo'), LU=document.getElementById('lu'),
    LP=document.getElementById('lp'), REM=document.getElementById('lrem'),
    LOUT=document.getElementById('lout');
if(!box){MSG.className='msg err';MSG.textContent='页面数据缺失，请向星星老师索取完整文件。';return;}

/* crypto.subtle 只在安全上下文存在（https / localhost / file://）。http 明文站会失败。 */
if(!window.crypto||!window.crypto.subtle){
  MSG.className='msg err';
  MSG.textContent='当前环境不支持加密解锁，请用 https 打开或向星星老师索取离线文件。';
  GO.disabled=true; return;
}

var CONF;
try{CONF=JSON.parse(box.textContent.replace(/^\s+|\s+$/g,''));}
catch(e){MSG.className='msg err';
  MSG.textContent='页面数据损坏，请向星星老师重新索取文件。';GO.disabled=true;return;}
var STORE='lk_cek_parent2026_v1';

function b64(s){var bin=atob(s),u=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
function toB64(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
function enc(s){return new TextEncoder().encode(s);}
function normU(s){return (s||'').replace(/^\s+|\s+$/g,'').toLowerCase();}
function sha256hex(s){
  return crypto.subtle.digest('SHA-256',enc(s)).then(function(d){
    var a=Array.prototype.slice.call(new Uint8Array(d));
    return a.map(function(x){return ('0'+x.toString(16)).slice(-2)}).join('');
  });
}
function wrapKey(pw,user,saltBytes){
  return crypto.subtle.importKey('raw',enc(pw),'PBKDF2',false,['deriveBits'])
    .then(function(km){
      var ue=enc(normU(user)), full=new Uint8Array(ue.length+saltBytes.length);
      full.set(ue,0); full.set(saltBytes,ue.length);   // salt = utf8(username) + salt_user
      return crypto.subtle.deriveBits({name:'PBKDF2',salt:full,
        iterations:CONF.iters,hash:'SHA-256'},km,256);
    })
    .then(function(bits){
      return crypto.subtle.importKey('raw',bits,{name:'AES-GCM'},false,['decrypt']);
    });
}
function aesImport(rawView){
  return crypto.subtle.importKey('raw',rawView,{name:'AES-GCM'},false,['decrypt']);
}
function fail(t){MSG.className='msg err';MSG.textContent=t;}

function decryptPayload(cekView){
  return aesImport(cekView).then(function(k){
    return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(CONF.ivp)},k,b64(CONF.ct));
  }).then(function(pt){
    var json=new TextDecoder().decode(pt);
    var payload=JSON.parse(json);
    render(payload,cekView);
  });
}

function render(payload,cekView){
  if(CONF.title) document.title=CONF.title;
  var frag=document.createElement('div');
  frag.innerHTML=CONF.head||'';          // 样式是明文的，直接铺进 head
  while(frag.firstChild)document.head.appendChild(frag.firstChild);
  document.body.innerHTML=payload.html||'';
  if(payload.js){
    var sc=document.createElement('script');
    sc.textContent=payload.js;                 // innerHTML 不执行脚本，必须手动插入
    document.body.appendChild(sc);
  }
  var lo=document.createElement('button');
  lo.className='logout';lo.type='button';lo.textContent='退出本课程';
  lo.onclick=function(){try{localStorage.removeItem(STORE)}catch(e){}location.reload();};
  document.body.appendChild(lo);
  if(REM.checked){
    try{localStorage.setItem(STORE,toB64(new Uint8Array(cekView)))}catch(e){}
  }
}

function attempt(rawUser,rawPw,remember){
  var user=normU(rawUser), pw=rawPw||'';
  if(!user||!pw){fail('请填写用户名和密码');return;}
  GO.disabled=true;
  MSG.className='msg';
  MSG.innerHTML='<span class="spin"></span>正在解锁…';
  REM.checked=!!remember;
  sha256hex(user).then(function(uh){
    var hits=CONF.users.filter(function(r){return r.u===uh;});
    var rec=hits[0]||{u:'x',s:CONF.users[0].s,iv:CONF.users[0].iv,c:CONF.users[0].c};
    // 用户名不存在时也照常跑一次完整派生 + 解密并失败，耗时一致，防侧信道枚举
    return wrapKey(pw,user,b64(rec.s)).then(function(wk){
      return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(rec.iv)},wk,b64(rec.c));
    }).then(function(cek){
      if(!hits.length) throw new Error('nope');
      return decryptPayload(cek);
    });
  }).catch(function(){
    fail('用户名或密码不对，请核对后再试');
    GO.disabled=false;
  });
}

F.addEventListener('submit',function(e){
  e.preventDefault();
  attempt(LU.value,LP.value,REM.checked);
});

/* 本机已记住：直接用缓存的 CEK 打开 */
(function(){
  var cached=null;
  try{cached=localStorage.getItem(STORE)}catch(e){}
  if(!cached)return;
  LOUT.style.display='block';
  LOUT.onclick=function(){try{localStorage.removeItem(STORE)}catch(e){}location.reload();};
  MSG.className='msg';MSG.innerHTML='<span class="spin"></span>正在用本机凭证打开…';
  var raw;
  try{raw=b64(cached)}catch(e){try{localStorage.removeItem(STORE)}catch(_){}return;}
  Promise.resolve().then(function(){
    // 校验缓存合法性：base64 长度必须为 32 字节
    if(raw.length!==32) throw new Error('bad');
    return decryptPayload(raw);
  }).catch(function(){
    try{localStorage.removeItem(STORE)}catch(e){}
    LOUT.style.display='none';
    MSG.className='msg';MSG.textContent='';
    GO.disabled=false;
  });
})();

/* ── 「新学员注册」/「忘记密码」弹层 ─────────────────────── */
var MASK=document.getElementById('lmask'), MX=document.getElementById('lmx'),
    PR=document.getElementById('pnlReg'), PF=document.getElementById('pnlFog');
function closeP(){
  if(!MASK)return;
  MASK.classList.remove('on');MASK.setAttribute('aria-hidden','true');
}
function openP(n){
  if(!MASK)return;
  PR.hidden=(n!==1); PF.hidden=(n!==2);
  MASK.classList.add('on'); MASK.setAttribute('aria-hidden','false');
  if(MX)MX.focus();
}
var BR=document.getElementById('lreg'), BF=document.getElementById('lfog');
if(BR)BR.addEventListener('click',function(){openP(1)});
if(BF)BF.addEventListener('click',function(){openP(2)});
if(MX)MX.addEventListener('click',closeP);
if(MASK)MASK.addEventListener('click',function(e){if(e.target===MASK)closeP();});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'||e.keyCode===27)closeP();
});
/* 从课程页点「新学员报名」进来时，直接把注册面板顶开 */
if(location.hash==='#enroll')openP(1);
else if(location.hash==='#forgot')openP(2);
/* 就绪信号：body 里有 200KB+ 的密文 JSON 要解析，DOM 里出现输入框时脚本还没跑完。
   自动化测试请等这个属性，别等输入框 —— 线上网络慢时会踩空。 */
document.documentElement.setAttribute('data-lock-ready','1');
})();
</script>
